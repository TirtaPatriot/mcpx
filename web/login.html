<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <script>
      // Pick the theme before the first paint so a light-theme visitor never sees a dark flash.
      try {
        var m = localStorage.getItem("mcpx-theme");
        var light = m === "light" || (m !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Sign in — MCP X</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-dark-900 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
    <div id="app" class="contents"></div>
    <script type="module" src="/src/login.tsx"></script>
  </body>
</html>
