services:
  oauth-gateway:
    build: .
    container_name: oauth-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "3000"
      DB_PATH: ${DB_PATH:-/app/data/tokens.db}
      # Empty = a random password is generated on first start and printed in the log (docker compose logs)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: if set, seeded into the SQLite database on start
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      MCP_SERVERS: ${MCP_SERVERS:-}
      # Public gateway URL (https, origin only) for OAuth discovery; empty = follow the Host/X-Forwarded-* headers
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Allowed redirect hosts (subdomains included), comma-separated (Google, OpenAI, Claude, Cursor, localhost)
      ALLOWED_REDIRECT_HOSTS: ${ALLOWED_REDIRECT_HOSTS:-google.com,oauth-redirect.googleusercontent.com,chatgpt.com,openai.com,claude.ai,anthropic.com,cursor.com,localhost,127.0.0.1}
      # Access token lifetime; default 30 days (2592000s)
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2592000}
      # Refresh token lifetime; default 1 year (31536000s)
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-31536000}
      # 60-second grace period for refresh-token rotation
      REFRESH_GRACE_PERIOD: ${REFRESH_GRACE_PERIOD:-60}
      # true = log each SSE chunk (truncated to 200 characters); false to turn it off
      LOG_SSE_CHUNKS: ${LOG_SSE_CHUNKS:-true}
    extra_hosts:
      # Lets the container reach MCP servers running on the host (Linux)
      - "host.docker.internal:host-gateway"
